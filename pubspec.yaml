name: kheryne
description: "Kheryne: AI-assisted identification of plant-parasitic nematodes (order to genus) from microscope images."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  camera: ^0.12.1
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  http: ^1.3.0
  intl: ^0.20.3
  path_provider: ^2.1.5
  supabase_flutter: ^2.8.4
  url_launcher: ^6.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Inter 4.1 (SIL OFL 1.1, see assets/fonts/Inter-OFL.txt). Bundled instead
    # of fetched at runtime so the app works offline in the lab.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
    # Phosphor Regular icon font (MIT, see assets/fonts/Phosphor-MIT.txt).
    # Bundled directly: the phosphor_flutter package no longer compiles on
    # Flutter 3.47 (IconData became a final class).
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    # Optical size for large titles (22 px and up).
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-SemiBoldItalic.ttf
          weight: 600
          style: italic
